name: Testes MongoDB

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mongo-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Executar smoke test
        run: docker compose -p delta-mongo-ci -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from runner
      - name: Remover containers
        if: always()
        run: docker compose -p delta-mongo-ci -f docker-compose.test.yml down

  report-ci:
    name: Reportar resultado do CI na PR
    if: always() && github.event_name == 'pull_request'
    needs:
      - smoke
    uses: delta-app-ofc/.github/.github/workflows/report_ci.yml@3c58dc7de153e08f489708dea824fef2998ee948
    with:
      needs_results: ${{ toJSON(needs) }}
    secrets:
      DELTA_ORG_AUTOMATION_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
    permissions:
      actions: read
      issues: write
      pull-requests: write
