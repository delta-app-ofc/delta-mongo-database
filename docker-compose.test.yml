services:
  mongo:
    image: mongo:7
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "const ping = db.adminCommand({ ping: 1 }); quit(ping.ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  runner:
    image: mongo:7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |-
        mongosh --quiet mongodb://mongo:27017 --file /scripts/delta-telemetry/script-collections.js
        mongosh --quiet mongodb://mongo:27017 --file /scripts/delta-app/script-collections.js
        mongosh --quiet mongodb://mongo:27017 --file /scripts/delta-telemetry/script-indexes.js
        mongosh --quiet mongodb://mongo:27017 --file /scripts/delta-app/script-indexes.js
        exec mongosh --quiet mongodb://mongo:27017 --file /tests/smoke.js
    volumes:
      - ./scripts:/scripts:ro
      - ./tests:/tests:ro
    depends_on:
      mongo:
        condition: service_healthy
