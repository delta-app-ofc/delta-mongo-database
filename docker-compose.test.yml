services:
  mongo:
    image: mongo:7
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "const ping = db.adminCommand({ ping: 1 }); quit(ping.ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  runner:
    image: mongo:7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |-
        exec /bin/sh /tests/run-smoke.sh
    volumes:
      - ./scripts:/scripts:ro
      - ./tests:/tests:ro
      - ./reports:/reports
    depends_on:
      mongo:
        condition: service_healthy
